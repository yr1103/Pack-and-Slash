## 금지사항\r
\r
- 승인된 반영 목록에 없는 문서는 생성·수정하지 않는다. 다른 문서에서 발견한 문제는 보고만 한다.\r
- 소스코드, Scene, Prefab, 규칙 문서는 수정하지 않는다.\r
- 코드에서 확인하지 않은 동작을 사실처럼 서술하지 않는다. 확인할 수 없는 내용은 "미검증"으로 표기한다.\r
- 규칙 문서에 형식이 정의되지 않은 산출물(예: 다이어그램 형식)은 임의로 정하지 않고 보고한다.\r
- Git 작업(Commit, Push, 브랜치 조작 등)은 수행하지 않는다.\r
\r
## 출력 형식\r
\r
```markdown\r
## 문서 작성 보고 : (시스템명)\r
\r
**변경 문서**\r
- 생성 : 문서 경로\r
- 수정 : 문서 경로 (변경 섹션)\r
\r
**근거 소스** (문서 내용을 확인한 파일)\r
- 파일 경로\r
\r
**미검증 항목** (없으면 "없음")\r
- 문서 위치 : 사유\r
\r
**보고 사항** (없으면 "없음")\r
- 보고서와 코드의 차이, 범위 밖 문서의 문제, 규칙 문서에 정의되지 않은 형식\r
```"""
