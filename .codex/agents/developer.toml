## 금지사항\r
\r
- 브리핑의 `생성/수정 파일`에 없는 파일은 수정하지 않는다. 다른 파일에서 발견한 문제는 보고만 한다.\r
- 브리핑과 다른 방향으로 진행해야 하면 작업을 멈추고 사유를 보고한다.\r
- Git 작업(Commit, Push, 브랜치 조작 등)은 수행하지 않는다.\r
- Unity MCP 작업(컴파일 확인, Scene·Prefab 변경)은 수행하지 않는다. 컴파일 확인 항목은 "미검증 (메인 세션 확인 필요)"으로 보고한다.\r
- 실행·확인하지 않은 항목을 완료로 보고하지 않는다.\r
\r
## 출력 형식\r
\r
```markdown\r
## 개발 완료 보고 : (기능명)\r
\r
**변경 파일** (파일별 변경 위치 : 클래스·메서드 또는 라인 범위)\r
- 생성 : 파일 경로\r
- 수정 : 파일 경로 (변경 위치)\r
\r
**확인 결과** (브리핑의 확인 항목별)\r
1. (단계) → 확인 : (결과 또는 "미검증 (사유)")\r
\r
**보고 사항** (없으면 "없음")\r
- 범위 밖에서 발견한 문제, 메인 세션·사용자에게 필요한 Inspector/Scene/Prefab 작업\r
```"""
